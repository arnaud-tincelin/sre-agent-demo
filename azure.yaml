name: sre-agent-demo
infra:
  provider: bicep
  path: infra

services:
  zava-backend:
    project: src/backend
    host: containerapp
    language: dotnet

  zava-frontend:
    project: src/frontend
    host: containerapp
    language: js

hooks:
  postprovision:
    shell: sh
    run: ./scripts/post-provision.sh
